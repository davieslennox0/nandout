name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the web bundle to the rolling `web-latest` release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: compiler · attestor · agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @latch/compiler test
      - run: pnpm --filter @latch/compiler typecheck
      - name: Fixtures are up to date with the compiler
        run: pnpm compile:circuits && git diff --exit-code contracts/test/fixtures/circuits.json
      - run: pnpm --filter @latch/attestor test
      - run: pnpm --filter @latch/attestor typecheck
      - run: pnpm --filter @latch/agent test
      - run: pnpm --filter @latch/agent typecheck
      - name: Web lock rules (validation, threshold math, formatting)
        run: pnpm --filter @latch/web test

  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install libs
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
      - run: forge build --sizes
      - run: forge test -vv
      - name: Fork test against X Layer mainnet (read-only, local fork)
        env:
          XLAYER_RPC_URL: https://rpc.xlayer.tech
        run: forge test --mc ForkTest -vv

  web:
    name: web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Contract addresses are public; set them as repository variables after the mainnet deploy.
          NEXT_PUBLIC_LATCH_GATE: ${{ vars.NEXT_PUBLIC_LATCH_GATE }}
          NEXT_PUBLIC_LATCH_LOCK: ${{ vars.NEXT_PUBLIC_LATCH_LOCK }}
          NEXT_PUBLIC_LATCH_FEED: ${{ vars.NEXT_PUBLIC_LATCH_FEED }}
          NEXT_PUBLIC_LATCH_EVALUATOR: ${{ vars.NEXT_PUBLIC_LATCH_EVALUATOR }}
          NEXT_PUBLIC_PROCESSOR: ${{ vars.NEXT_PUBLIC_PROCESSOR }}
        run: pnpm build
      - name: Package standalone bundle
        run: |
          set -euo pipefail
          out=web/.next/standalone
          mkdir -p "$out/web/.next"
          cp -r web/.next/static "$out/web/.next/static"
          [ -d web/public ] && cp -r web/public "$out/web/public" || true
          echo "${GITHUB_SHA}" > "$out/REVISION"
          tar -C "$out" -czf nandout-web.tar.gz .
          echo "${GITHUB_SHA}" > nandout-web.sha
          ls -la nandout-web.tar.gz
      - name: Publish to rolling release web-latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-latest >/dev/null 2>&1 || gh release create web-latest --title "web-latest" --notes "Rolling build of web/ from main. Pulled by the server (deploy/pull-web.sh)." --prerelease
          gh release upload web-latest nandout-web.tar.gz nandout-web.sha --clobber
